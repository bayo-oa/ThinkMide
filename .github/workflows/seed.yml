name: Seed Sanity content
on: workflow_dispatch
jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx sanity dataset import seed/sample.ndjson production --replace
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
          NEXT_PUBLIC_SANITY_PROJECT_ID: 00cyay7z
          NEXT_PUBLIC_SANITY_DATASET: production
